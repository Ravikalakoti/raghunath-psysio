databases:
  - name: clinic-db
    plan: free
    databaseName: clinic
    user: clinic

services:
  - type: web
    name: clinic-manager
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn clinic.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString
      - key: CLINIC_NAME
        value: Raghunath Physiotherapy
      - key: CLINIC_TAGLINE
        value: Physiotherapy & Rehabilitation Centre
      - key: CLINIC_PHONE
        sync: false
      - key: CLINIC_ADDRESS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
